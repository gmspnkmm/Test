<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader"></div>

    <script>
        // 1. Put your list of destination links here
        const linkPool = [
            "https://gmspnkmm.github.io/Bible-verse-1/",
            "https://gmspnkmm.github.io/Bible-verse-2/",
            "https://gmspnkmm.github.io/Bible-verse-3/"
        ];

        // 2. Check if this device already has an assigned link saved
        let assignedLink = localStorage.getItem("assigned_qr_link");

        if (!assignedLink) {
            // First time scanning: Pick a completely random link from the pool
            const randomIndex = Math.floor(Math.random() * linkPool.length);
            assignedLink = linkPool[randomIndex];
            
            // Save it forever in this specific device's browser memory
            localStorage.setItem("assigned_qr_link", assignedLink);
        }

        // 3. Send the user to their assigned link
        window.location.href = assignedLink;
    </script>
</body>
</html>
